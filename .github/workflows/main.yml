name: Pantau Dammam OSINT

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Kirim Tes ke Telegram
        run: |
          curl -X POST "https://api.telegram.org/bot9042449612:AAGpL1m7I7ul6BAKm4OKWbyvSZ2zVIb2fWk/sendMessage" \
          -H "Content-Type: application/json" \
          -d '{"chat_id":"8427903806","text":"✅ SUKSES! Sistem OSINT Dammam aktif. Berjalan otomatis setiap jam."}'
      
      - name: Cek Gempa Bumi (USGS)
        run: |
          RESPONSE=$(curl -s "https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&latitude=26.3431487&longitude=50.0950294&maxradiuskm=30&orderby=time&limit=5")
          MAGNITUDE=$(echo "$RESPONSE" | python3 -c "import sys,json; data=json.load(sys.stdin); features=data.get('features',[]); print(features[0]['properties']['mag']) if features else print('0')")
          if (( $(echo "$MAGNITUDE >= 2.5" | bc -l) )); then
            curl -X POST "https://api.telegram.org/bot9042449612:AAGpL1m7I7ul6BAKm4OKWbyvSZ2zVIb2fWk/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"8427903806\",\"text\":\"🌍 GEMPA TERDETEKSI! Magnitudo: $MAGNITUDE dalam radius 30km dari Al Shu'lah, Dammam.\"}"
          fi
